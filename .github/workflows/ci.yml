name: TerAuth CI / Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: terauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Synchronize Database Schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/terauth_test?schema=public
        run: npx prisma db push --skip-generate

      - name: Seed Database for Test Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/terauth_test?schema=public
        run: npm run prisma:seed

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/terauth_test?schema=public
          JWT_ACCESS_SECRET: terauth_test_ci_access_secret_key_minimum_32_characters
          JWT_REFRESH_SECRET: terauth_test_ci_refresh_secret_key_minimum_32_characters
          NODE_ENV: test
        run: npm test

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Production Build (TSC & Vite)
        working-directory: frontend
        run: npm run build
